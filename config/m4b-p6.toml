schema_version = "1.0.0"
workspace_root = "../workspaces"

[pipeline]
packet_seconds = 300
packet_overlap_seconds = 30

[frames]
scene_threshold = 0.28
periodic_interval_seconds = 45
cue_offsets_seconds = [-2.0, 0.0, 2.0, 5.0]
duplicate_threshold = 6
progressive_slide_protection_seconds = 20.0
local_change_ratio_threshold = 0.002
edge_change_ratio_threshold = 0.001
high_contrast_change_ratio_threshold = 0.0005
max_candidate_frames = 500
max_final_frames = 100
contact_sheet_max_frames = 12
