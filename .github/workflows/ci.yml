name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The deterministic FFmpeg smoke is calibrated and supported on the project's target OS.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Sync locked development environment
        run: uv sync --dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test with coverage gate
        run: uv run pytest --cov=lectureflow --cov-fail-under=87.86
